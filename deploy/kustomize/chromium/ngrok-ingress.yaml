apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chromium-ngrok
  namespace: chromium
spec:
  ingressClassName: ngrok
  rules:
  - host: ${NGROK_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chromium
            port:
              number: 3000
