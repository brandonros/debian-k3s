apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: pdf-generator
  namespace: pdf-generator
spec:
  repo: https://raw.githubusercontent.com/brandonros/hull-wrapper/master/
  chart: hull-wrapper
  targetNamespace: pdf-generator
  version: 0.2.0
  valuesContent: |-
    hull:
      config:
        general:
          nameOverride: pdf-generator
          rbac: false
          noObjectNamePrefixes: true
      objects:
        serviceaccount:
          default:
            enabled: false
        deployment:
          pdf-generator:
            replicas: 4
            annotations:
              linkerd.io/inject: enabled
              config.linkerd.io/proxy-log-level: debug
            pod:
              containers:
                main:
                  resources:
                    requests:
                      memory: 256Mi
                      cpu: 200m
                    limits:
                      memory: 512Mi
                      cpu: 500m
                  image:
                    repository: ghcr.io/brandonros/pdf-generator
                    tag: 23c39e48d17d5e113489f105ec56d79612b1fa26
                  env:
                    BROWSER_WS_ENDPOINT:
                      value: ws://chromium.chromium.svc.cluster.local:3000/
                  ports:
                    http:
                      containerPort: 3000
        service:
          pdf-generator:
            type: ClusterIP
            ports:
              http:
                port: 3000
                targetPort: 3000
